name: Ace 5 runtime components
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      JOBS: '2'
      MESA_JOBS: '2'
      XNU_CC: /usr/bin/clang-18
      XNU_CXX: /usr/bin/clang++-18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build tools
        run: |
          mkdir -p out/runtime-ci
          df -h .
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git curl xz-utils \
            clang-18 lld-18 llvm-18 flex bison m4 perl autoconf automake libtool pkg-config \
            libncurses-dev uuid-dev python3 python3-venv meson ninja-build zlib1g-dev libssl-dev
      - name: Pinned SDK and toolchain only; no iOS firmware download
        run: bash tools/ace5/ci-build.sh dependencies 2>&1 | tee out/runtime-ci/dependencies.log
      - name: Compile graphics and runtime components
        run: bash tools/ace5/ci-runtime.sh 2>&1 | tee out/runtime-ci/build.log
      - name: Collect build diagnostics
        if: always()
        run: |
          df -h .
          find xnu-deps/build/mesa -maxdepth 1 -name '*.log' -type f \
            -exec cp '{}' out/runtime-ci/ ';' 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ace5-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/runtime-ci/
          retention-days: 7
          if-no-files-found: error
